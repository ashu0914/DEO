  <body>
    <script>
      // Runs before React mounts so a saved "light" preference doesn't
      // flash dark for a frame on load.
      try {
        var t = localStorage.getItem('deo:theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <div id="root"></div>
  </body>
</html>
